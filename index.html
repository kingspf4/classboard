<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業繳交看板</title>
<meta name="theme-color" content="#2453C2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F3F4F6; --surface:#FFFFFF; --ink:#16181D; --muted:#5B616E; --line:#E2E5EA; --line2:#D3D7DE;
    --accent:#2453C2; --accent-dark:#1A3D91;
    --miss-ink:#9C3A17; --miss-line:#B4471F; --miss-bg:#FDF1EC;
    --sub:#1D6B50; --tc:#F2B33D; --tc-line:#D9971C; --tc-ink:#3A2700; --tc-text:#7A5300; --cor:#2453C2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none !important}

  /* ---------- 座號格（兩種畫面共用） ---------- */
  .seat{border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;aspect-ratio:1/1;border:2px solid transparent;user-select:none;transition:transform .12s, outline-color .3s}
  .seat:active{transform:scale(.9)}
  .s-miss{background:#fff;color:var(--miss-ink);border:2px dashed var(--miss-line)}
  .s-sub{background:var(--sub);color:#fff;border-color:var(--sub)}
  .s-tc{background:var(--tc);color:var(--tc-ink);border-color:var(--tc-line)}
  .s-cor{background:var(--cor);color:#fff;border-color:var(--cor)}
  .s-leave{background:#E5E7EB;color:#5B616E;border:2px solid #C9CED6}
  .fresh{outline:5px solid var(--tc);outline-offset:3px}

  /* ---------- 教師畫面 ---------- */
  .t-header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:sticky;top:0;z-index:5}
  .t-title{margin-right:auto;display:flex;flex-direction:column}
  .t-title h1{margin:0;font-size:20px;font-weight:900}
  .t-title span{font-size:13px;color:var(--muted)}
  .datenav{display:flex;align-items:center;gap:2px;background:var(--ground);border-radius:12px;padding:4px}
  .iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#E8EAEE}
  .datebox{position:relative;text-align:center;min-width:120px;padding:0 6px}
  .datebox b{display:block;font-size:17px}
  .datebox small{font-size:12px;color:var(--muted)}
  .datebox input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .seg{display:flex;gap:4px;background:var(--ground);border-radius:12px;padding:4px}
  .seg button{height:40px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--sub)}
  .dot.bad{background:var(--miss-line)}

  .t-main{padding:16px 16px 90px;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .cards{flex:999 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card-head{display:flex;align-items:center;gap:8px}
  .card-head h2{margin:0;font-size:19px;font-weight:900;flex:1;min-width:0;overflow-wrap:anywhere}
  .card-head .done{font-size:13px;color:var(--muted);white-space:nowrap}
  .bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--ground)}
  .grid10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
  .grid10 .seat{font-size:14px;min-height:30px}
  .counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:700}
  .c-miss{color:var(--miss-ink)} .c-tc{color:var(--tc-text)} .c-sub{color:var(--sub)} .c-cor{color:var(--cor)}
  .card-tools{display:flex;flex-wrap:wrap;gap:6px}
  .small{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:700}
  .small.danger{color:var(--miss-ink);border-color:#E9B8A5}

  .leave-strip{flex:1 1 100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
  .diary-list{margin:0;padding-left:1.4em;font-size:15px;line-height:1.7}
  .leave-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .leave-grid button{height:48px;border-radius:10px;border:2px solid var(--line2);background:#fff;font-weight:700;font-size:16px}
  .leave-grid button[aria-pressed="true"]{background:#5B616E;color:#fff;border-color:#5B616E}
  .tool-block{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid #EEF0F3}
  .tool-block:last-of-type{border-bottom:0;padding-bottom:0}
  .tool-block b{font-size:15px}
  .tool-row{display:flex;flex-wrap:wrap;gap:6px}
  .tool-row .small{height:40px;min-width:56px}
  .timer-big{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
  .check{display:flex;align-items:center;gap:8px;font-size:14px}
  .check input{width:20px;height:20px}
  .tabs button{min-width:84px}
  .leave-strip.due{background:#F7F9FE;border-color:#D5DEF5;line-height:1.6}
  .diary-main{flex-direction:column;align-items:stretch;max-width:760px}
  .due-strip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7}
  .dblock{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .dblock.off{opacity:.55}
  .dblock-head{color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dblock-head h2{margin:0;font-size:17px;font-weight:900;letter-spacing:.04em}
  .dblock-head span{font-size:13px;font-weight:700}
  .dblock-body{padding:4px 14px 12px}
  .ditem{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid #EEF0F3}
  .ditem-text{flex:1;min-width:0;text-align:left;background:none;border:0;font-size:16px;padding:8px 0;min-height:44px;line-height:1.5;overflow-wrap:anywhere}
  .grade{flex:none;width:44px;height:36px;border-radius:9px;border:2px solid var(--line2);background:#fff;font-weight:900;font-size:15px;color:var(--muted)}
  .grade[aria-pressed="true"]{background:var(--sub);border-color:var(--sub);color:#fff}
  .exam-tag{flex:none;font-size:12px;font-weight:900;padding:2px 7px;border-radius:6px;background:var(--tc);color:var(--tc-ink)}
  .del{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:9px;display:flex;align-items:center;justify-content:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
  .chip{height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:700}
  .chip.ghost{border-style:dashed}
  .dactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lay-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid #EEF0F3}
  .lay-top{display:flex;align-items:center;gap:8px}
  .lay-top b{flex:1;font-size:15px}
  .lay-dot{width:14px;height:14px;border-radius:50%;flex:none}
  .lay-size{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--ground);border-radius:10px;padding:3px}
  .lay-size button{height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;font-size:13px}
  .lay-size button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .side{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .panel h2{margin:0;font-size:17px;font-weight:900}
  .sum-item{padding-bottom:10px;border-bottom:1px solid #EEF0F3;font-size:14px;line-height:1.6}
  .btn{height:48px;border-radius:12px;border:0;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-blue{background:var(--accent);color:#fff}
  .btn-blue:hover{background:var(--accent-dark)}
  .btn-line{background:#fff;color:var(--ink);border:1px solid var(--line2)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
  .switch{width:56px;height:32px;border-radius:999px;border:0;background:#C9CED6;position:relative;flex:none}
  .switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
  .switch[aria-checked="true"]{background:var(--sub)}
  .switch[aria-checked="true"]::after{left:28px}

  .offday{flex:1 1 100%;max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
  .offday h2{margin:0;font-size:22px}
  .offday p{margin:0;color:var(--muted);line-height:1.7}
  .empty{grid-column:1/-1;background:#fff;border:2px dashed var(--line2);border-radius:16px;padding:32px;text-align:center;color:var(--muted)}

  .legend{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;font-weight:700;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:4px;display:inline-block}

  @media (max-width:640px){
    .grid10{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
    .grid10 .seat{font-size:16px}
    .cards{grid-template-columns:1fr}
    .t-header{gap:10px}
    .seg{width:100%} .seg button{flex:1}
    .datenav{flex:1}
    .datebox{flex:1}
  }

  /* ---------- 對話框與提示 ---------- */
  .modal{position:fixed;inset:0;background:rgba(22,24,29,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .dialog{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .dialog h2{margin:0;font-size:19px}
  .form{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
  .form input{height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 10px;font-size:16px;color:var(--ink);width:100%}
  @media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form label:first-child{grid-column:1/-1}}
  .result{background:var(--ground);border-radius:12px;padding:14px;font-size:14px;line-height:1.8;white-space:pre-line}
  .dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  textarea.copybox{width:100%;min-height:180px;border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:14px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center}

  /* ---------- 教室大螢幕 ----------
     所有尺寸都以 rem 為單位；程式會自動調整整頁字級，讓畫面剛好塞進螢幕、不需捲動。 */
  html.display-mode{overflow:hidden}
  .d-wrap{--seat:3.4rem;--gap:.5rem;padding:1.2rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
  .d-head{display:flex;align-items:center;gap:1.5rem}
  .d-head h1{margin:0;font-size:2.4rem;font-weight:900;line-height:1.2}
  .d-head .sub{font-size:1.15rem;color:var(--muted);font-weight:500}
  .d-sync{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:.9rem;padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem}
  .d-sync .dot{width:.8rem;height:.8rem;box-shadow:0 0 0 .3rem #D7EDE4}
  .d-sync .dot.bad{box-shadow:0 0 0 .3rem #F6DCD1}
  .d-sync b{display:block;font-size:1rem}
  .d-sync small{font-size:.85rem;color:var(--muted)}
  .d-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2rem}
  .d-card{--cols:6;--rows:5;width:calc(var(--cols) * var(--seat) + (var(--cols) - 1) * var(--gap) + 2.4rem);background:#fff;border:1px solid var(--line);border-radius:1.2rem;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
  .d-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem}
  .d-card h2{margin:0;font-size:1.7rem;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
  .d-card .done{font-size:1rem;color:var(--muted);font-weight:700;white-space:nowrap}
  .d-grid{display:grid;grid-template-columns:repeat(var(--cols),var(--seat));gap:var(--gap)}
  .seat-gap{width:var(--seat);height:var(--seat)}
  .d-podium{text-align:center;font-size:.85rem;font-weight:700;color:var(--muted);background:var(--ground);border-radius:.4rem;padding:.15rem 0;letter-spacing:.4em}
  .d-announce{background:var(--accent);color:#fff;border-radius:1rem;padding:.8rem 1.4rem;font-size:1.7rem;font-weight:900;display:flex;align-items:center;gap:1rem}
  .d-announce svg{flex:none;width:1.8rem;height:1.8rem}
  .d-tool{position:fixed;inset:0;background:rgba(22,24,29,.6);display:flex;align-items:center;justify-content:center;z-index:10}
  .d-tool-card{background:#fff;border-radius:4vmin;padding:4vmin 9vmin;text-align:center;min-width:55vmin}
  .d-tool-label{font-size:4.5vmin;color:var(--muted);font-weight:700}
  .d-tool-big{font-size:24vmin;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
  .d-tool-sub{font-size:4.5vmin;color:var(--muted);font-weight:700}
  .timeup .d-tool-big{color:var(--miss-ink);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .d-hint{font-size:.8rem;color:var(--muted)}
  .d-grid .seat{width:var(--seat);height:var(--seat);font-size:calc(var(--seat) * .42);font-weight:900;border-radius:.7rem;border-width:3px}
  .d-counts{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;font-size:1rem;font-weight:700}
  .d-private{height:calc(var(--rows) * var(--seat) + (var(--rows) - 1) * var(--gap));display:flex;flex-direction:column;justify-content:center;gap:1.2rem}
  .d-private .bar{height:1.2rem}
  .d-private .big{font-size:3rem;font-weight:900;text-align:center}
  .d-private .big span{font-size:1.4rem;color:var(--muted);font-weight:500}
  .d-foot{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem;font-size:.95rem;color:var(--muted)}
  .d-foot .sw{width:1rem;height:1rem;border-radius:.25rem}
  .d-zoom{margin-left:auto;display:flex;gap:.4rem;align-items:center;font-size:.8rem}
  .d-zoom button{width:2rem;height:2rem;border-radius:.5rem;border:1px solid var(--line2);background:#fff;color:var(--muted);font-size:1rem;font-weight:700;line-height:1;padding:0}
  .d-diary{background:#fff;border:1px solid var(--line);border-radius:1.2rem;padding:1.6rem 2.4rem}
  .d-diary ol{margin:0;padding-left:2.2em;font-size:2.2rem;font-weight:700;line-height:1.7}
  .d-diary li::marker{color:var(--accent);font-weight:900}
  .dd-wrap{height:100vh;box-sizing:border-box;padding:1.3rem 1.8rem;display:flex;flex-direction:column;gap:.75rem}
  .dd-head{display:flex;align-items:flex-end;gap:1.4rem;flex:none}
  .dd-head h1{margin:0;font-size:2.8rem;font-weight:900;line-height:1;letter-spacing:.04em}
  .dd-head .date{font-size:2.8rem;font-weight:900;color:var(--ink);line-height:1;letter-spacing:.02em}
  .dd-head .week{font-size:2.8rem;font-weight:900;line-height:1;color:#fff;background:var(--accent);border-radius:.6rem;padding:.15em .45em}
  .dd-head .cls{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
  .dd-head .dot{width:.7rem;height:.7rem;box-shadow:0 0 0 .25rem #D7EDE4}
  .dd-head .d-zoom{margin-left:0}
  .dd-nav{width:2.6rem;height:2.6rem;flex:none;align-self:center;border:1px solid var(--line2);background:#fff;border-radius:.6rem;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
  .dd-nav svg{width:1.3rem;height:1.3rem}
  .dd-nav:disabled{opacity:.3;cursor:default}
  .dd-today{align-self:center;height:2.6rem;padding:0 1rem;border:0;border-radius:.6rem;background:var(--tc);color:var(--tc-ink);font-size:1.1rem;font-weight:900}
  .dd-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem}
  .dd-row{min-height:0;display:flex;background:#fff;border:1px solid var(--line);border-radius:1rem;overflow:hidden}
  .dd-label{width:17vw;flex:none;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:.3rem .7rem;box-sizing:border-box;overflow:hidden;font-weight:900;letter-spacing:.06em;line-height:1.2}
  .dd-label span{display:block;word-break:keep-all}
  .dd-list{flex:1;min-width:0;padding:.4rem 1.6rem;overflow:hidden;display:flex;align-items:center}
  .dd-inner{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:.35em}
  .dd-inner li{display:flex;align-items:flex-start;gap:.5em;font-weight:700;line-height:1.4}
  .dd-num{flex:none;width:1.25em;height:1.25em;margin-top:.08em;border-radius:50%;font-size:.8em;font-weight:900;display:flex;align-items:center;justify-content:center}
  .dd-exam{flex:none;margin-top:.2em;font-size:.62em;font-weight:900;line-height:1;padding:.3em .5em;border-radius:.4em;background:var(--tc);color:var(--tc-ink)}
  .dd-text{overflow-wrap:anywhere}
  .dd-text.exam{font-weight:900;color:#7A3510}
  .dd-empty{color:var(--muted);font-weight:500;font-size:.55em}
  .d-off{padding:4rem 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
  .d-off h2{margin:0;font-size:3rem;font-weight:900}
  .d-off p{margin:0;font-size:1.4rem;color:var(--muted)}
  /* 課表：目前節次 */
  .tt-strip{flex:none;display:flex;align-items:center;gap:1.2rem;background:#fff;border:1px solid var(--line);border-radius:1rem;padding:.55rem 1.2rem;font-weight:900;line-height:1.2;white-space:nowrap}
  .dd-wrap .tt-now{font-size:2.6rem}
  .dd-wrap .tt-next,.dd-wrap .tt-left{font-size:1.8rem}
  .tt-now{display:flex;align-items:center;gap:.8rem;font-size:2.2rem}
  .tt-tag{font-size:.55em;padding:.3em .6em;border-radius:.5em;background:var(--ink);color:#fff;letter-spacing:.04em}
  .tt-tag.brk{background:var(--tc);color:var(--tc-ink)}
  .tt-sub{color:var(--muted);font-size:.6em;font-weight:700}
  .tt-left{margin-left:auto;font-size:1.5rem;color:var(--muted);font-weight:700}
  .tt-left b{color:var(--ink);font-size:1.25em}
  .tt-next{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;color:var(--muted);font-weight:700;border-left:2px solid var(--line);padding-left:1.2rem}
  .tt-next b{color:var(--ink);font-weight:900}
  .tt-table{border-collapse:collapse;font-size:14px;min-width:640px}
  .tt-table th{font-size:12px;color:var(--muted);font-weight:700;padding:4px;text-align:left}

<body>
<div id="app"><div style="padding:40px;text-align:center;color:#5B616E">載入中…</div></div>

<script>
var PARAMS = new URLSearchParams(location.search);
var VIEW = PARAMS.get('view') === 'display' || PARAMS.get('view') === 'diary' ? 'display' : 'teacher';
var DIARY_ONLY = PARAMS.get('view') === 'diary';
document.title = DIARY_ONLY ? '聯絡簿' : VIEW === 'display' ? '作業看板' : '作業繳交看板';
var STATUSES = ['未交', '已交', '待訂正', '已訂正'];
var KEY = { '未交': 'miss', '已交': 'sub', '待訂正': 'tc', '已訂正': 'cor', '請假': 'leave' };
var WEEK = '日一二三四五六';

var state = null;       // 伺服器回傳的當天資料
var rev = '';           // 資料版本，用來判斷要不要重讀
var date = todayStr();
var pending = 0;        // 正在送出的修改數；送出期間不覆蓋畫面，避免閃回舊狀態
var polling = false;
var lastFull = 0;
var syncOk = true;
var fresh = {};         // 剛變動的座號 → 時間，用於大螢幕的黃框提示
var manualDate = false;

/* ---------- 工具 ---------- */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr() { return fmt(new Date()); }
function niceDate(s) { var d = parse(s); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; }
function weekday(s) { return '星期' + WEEK.charAt(parse(s).getDay()); }
function shortDate(s) { var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK.charAt(d.getDay()) + '）'; }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  try { return Promise.resolve(API[fn].apply(null, args)); } catch (e) { return Promise.reject(e); }
}
function errMsg(e) {
  if (e && /permission_denied|PERMISSION_DENIED/i.test(e.code || e.message || '')) return '這個帳號沒有權限修改資料。';
  return (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : '發生錯誤，請稍後再試。';
}
function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2600);
}
function seatStatus(a, i) { return (state.leave || []).indexOf(i + 1) >= 0 ? '請假' : a.seats[i]; }
function stats(a) {
  var c = { '未交': [], '已交': [], '待訂正': [], '已訂正': [], '請假': [] };
  a.seats.forEach(function (s, i) { if ((state.skip || []).indexOf(i + 1) < 0) c[seatStatus(a, i)].push(i + 1); });
  return c;
}
function countsHtml(c, cls) {
  return '<div class="' + cls + '"><span class="c-miss">未交 ' + c['未交'].length + '</span><span class="c-tc">待訂正 ' + c['待訂正'].length +
    '</span><span class="c-sub">已交 ' + c['已交'].length + '</span><span class="c-cor">已訂正 ' + c['已訂正'].length + '</span>' +
    (c['請假'].length ? '<span style="color:var(--muted)">請假 ' + c['請假'].length + '</span>' : '') + '</div>';
}
function diaryLines(t) { return String(t || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
function barHtml(c, size) {
  var w = function (k) { return (c[k].length / size * 100).toFixed(2) + '%'; };
  return '<div class="bar" aria-hidden="true">' +
    '<div style="width:' + w('已交') + ';background:var(--sub)"></div>' +
    '<div style="width:' + w('已訂正') + ';background:var(--cor)"></div>' +
    '<div style="width:' + w('待訂正') + ';background:var(--tc)"></div></div>';
}
function swatch(k) {
  var m = { '未交': 'background:#fff;border:2px dashed var(--miss-line)', '已交': 'background:var(--sub)', '待訂正': 'background:var(--tc)', '已訂正': 'background:var(--cor)', '請假': 'background:#E5E7EB;border:2px solid #C9CED6' };
  return '<span class="sw" aria-hidden="true" style="' + m[k] + ';box-sizing:border-box"></span>';
}
var ICON = {
  left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  copy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
};

/* 複製文字：Apps Script 網頁在 iframe 內，剪貼簿可能被瀏覽器擋下，失敗時改跳出文字框讓使用者手動複製 */
function copyText(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) { toast('已複製，可以貼到 LINE'); return; }
  openModal('<h2>請手動複製</h2><textarea class="copybox" readonly>' + esc(text) + '</textarea>' +
    '<div class="dialog-actions"><button class="btn btn-line" onclick="closeModal()">關閉</button></div>');
  var box = document.querySelector('.copybox'); box.focus(); box.select();
}
function openModal(inner) {
  closeModal();
  var m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal';
  m.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">' + inner + '</div>';
  m.addEventListener('click', function (e) { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function closeModal() { var m = document.getElementById('modal'); if (m) m.remove(); }

/* ---------- 同步：Firebase 一有變動就重新組畫面（不再定時詢問） ---------- */
var refreshQueued = false;
function scheduleRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  setTimeout(function () { refreshQueued = false; refresh(); }, 30);
}
function refresh() {
  if (!DB || denied) return;
  watchDay(date);
  if (!ready(date)) return;
  syncDue(date, todayStr());
  var r = buildState(date);
  // 手機若還留著舊版 data.js，缺少的欄位補上預設值，避免畫面卡在載入中
  if (!r.skip) r.skip = [];
  if (!r.count) r.count = r.size - r.skip.length;
  if (!r.timetable) r.timetable = [];
  markFresh(state, r);
  state = r;
  render();
}
function poll() { scheduleRefresh(); }   // 舊程式呼叫的名稱，保留相容
/* 大螢幕：沒有手動切日期時，過了午夜自動換到新的一天；手動切換 5 分鐘沒動作就回到今天 */
setInterval(function () {
  if (VIEW !== 'display') return;
  if (manualDate && Date.now() - lastNavAt > 5 * 60 * 1000) manualDate = false;
  if (!manualDate && date !== todayStr()) { date = todayStr(); state = null; render(); scheduleRefresh(); }
}, 20000);
function markFresh(oldS, newS) {
  if (!oldS || oldS.date !== newS.date) return;
  var now = Date.now();
  newS.assignments.forEach(function (a) {
    var o = null;
    oldS.assignments.forEach(function (x) { if (x.row === a.row && x.title === a.title) o = x; });
    if (!o) return;
    a.seats.forEach(function (s, i) { if (o.seats[i] !== s) fresh[a.title + '|' + (i + 1)] = now; });
  });
  setTimeout(render, 8100);
}
function isFresh(title, seat) { var t = fresh[title + '|' + seat]; return t && Date.now() - t < 8000; }
function updateSync() {
  var d = document.querySelectorAll('.dot');
  for (var i = 0; i < d.length; i++) d[i].className = 'dot' + (syncOk ? '' : ' bad');
  var l = document.getElementById('sync-label');
  if (l) l.textContent = syncOk ? '即時同步中' : '連線中斷，重試中…';
}

/* ---------- 倒數計時與抽籤的畫面更新（每 0.1 秒） ---------- */
var clockOffset = 0;      // 伺服器時間與本機時間的差距
var lastPickAt = null, rollUntil = 0, beepedFor = null, audioCtx = null;
function remainingMs(t) { return t.end ? t.end - (Date.now() + clockSkew) : (t.left || 0); }
function fmtTime(ms) {
  if (ms <= 0) return '時間到！';
  var sec = Math.ceil(ms / 1000);
  return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
}
function tick() {
  if (!state || !state.tool) return;
  var t = state.tool;
  if (t.type === 'timer') {
    var ms = remainingMs(t);
    var els = document.querySelectorAll('.timer-left');
    for (var i = 0; i < els.length; i++) els[i].textContent = fmtTime(ms);
    var ov = document.querySelector('.d-tool');
    if (ov) ov.classList.toggle('timeup', ms <= 0);
    if (VIEW === 'display' && ms <= 0 && t.end && beepedFor !== t.end) { beepedFor = t.end; beep(); }
  }
  if (t.type === 'pick') {
    var el = document.getElementById('pick-num');
    if (el) el.textContent = Date.now() < rollUntil ? pad(rollSeat()) : pad(t.seat);
  }
}
function rollSeat() {
  var n; do { n = 1 + Math.floor(Math.random() * state.size); } while (state.skip.indexOf(n) >= 0 && state.skip.length < state.size);
  return n;
}
setInterval(tick, 100);
/* 瀏覽器規定要先點過畫面才能發出聲音：大螢幕點一下任何地方即可啟用提示音 */
function beep() {
  if (!audioCtx) return;
  [0, 0.35, 0.7].forEach(function (d) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime + d);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.3);
    o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.3);
  });
}
if (VIEW === 'display') {
  document.addEventListener('click', function () {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); toast('提示音已啟用'); render(); } catch (e) {}
  });
}


/* ---------- 教師畫面的操作 ---------- */
function goDay(offset) { var d = parse(date); d.setDate(d.getDate() + offset); setDate(fmt(d)); }
function setDate(s) { if (!s) return; date = s; manualDate = true; state = null; render(); scheduleRefresh(); }
/* 寫入：Firebase 會先在本機套用、再送到雲端，順序由同一條連線保證，不會互相覆蓋 */
function write(fn, args, okMsg) {
  return call.apply(null, [fn].concat(args)).then(function (r) {
    if (okMsg) toast(okMsg);
    if (r && r.warning) openModal('<h2>提醒</h2><p style="margin:0;line-height:1.7">' + esc(r.warning) + '</p>' +
      '<div class="dialog-actions"><button class="btn btn-dark" onclick="closeModal()">知道了</button></div>');
    return r;
  }).catch(function (e) {
    toast(errMsg(e));
    scheduleRefresh();
  });
}
function tap(ai, seat) {
  var a = state.assignments[ai];
  if (state.leave.indexOf(seat) >= 0) { toast(seat + ' 號今天請假，請先在「登記請假」取消'); return; }
  var cur = a.seats[seat - 1];
  // 依序切換：未交 → 點1下已交 → 點2下待訂正 → 點3下已訂正 → 點4下回到未交
  var next = STATUSES[(STATUSES.indexOf(cur) + 1) % STATUSES.length];
  a.seats[seat - 1] = next;
  render();
  write('setStatus', [date, a.row, a.title, seat, next]);
}
function setDayType(t) { state.day = { type: t, auto: false }; render(); write('setDayType', [date, t]); }
function addAssignment() {
  var name = prompt('作業名稱：', '');
  if (name && name.trim()) write('addAssignment', [date, name.trim()], '已新增「' + name.trim() + '」');
}
function renameAssignment(ai) {
  var a = state.assignments[ai];
  var name = prompt('修改作業名稱：', a.title);
  if (name && name.trim() && name.trim() !== a.title) write('renameAssignment', [date, a.row, a.title, name.trim()]);
}
function deleteAssignment(ai) {
  var a = state.assignments[ai];
  if (confirm('確定要刪除「' + a.title + '」？這一列紀錄會從試算表中移除。')) write('deleteAssignment', [date, a.row, a.title], '已刪除');
}
function allSubmitted(ai) {
  var a = state.assignments[ai];
  if (confirm('將「' + a.title + '」全班標記為「已交」？')) {
    a.seats = a.seats.map(function () { return '已交'; }); render();
    write('setAll', [date, a.row, a.title, '已交']);
  }
}
/* ---------- 請假 ---------- */
function openLeave() {
  openModal('<h2>登記今日請假</h2><p style="margin:0;color:var(--muted);font-size:14px">點座號切換請假。請假的學生今天所有作業都不算未交，區間追蹤也不會計入。</p>' +
    '<div class="leave-grid" id="leave-grid"></div>' +
    '<div class="dialog-actions"><button class="btn btn-dark" onclick="closeModal()">完成</button></div>');
  renderLeaveGrid();
}
function renderLeaveGrid() {
  var g = document.getElementById('leave-grid');
  if (!g) return;
  var h = '';
  for (var n = 1; n <= state.size; n++) {
    if (state.skip.indexOf(n) >= 0) continue;
    h += '<button aria-pressed="' + (state.leave.indexOf(n) >= 0) + '" aria-label="' + n + ' 號請假" onclick="toggleLeaveSeat(' + n + ')">' + pad(n) + '</button>';
  }
  g.innerHTML = h;
}
function toggleLeaveSeat(n) {
  var on = state.leave.indexOf(n) < 0;
  state.leave = on ? state.leave.concat([n]).sort(function (a, b) { return a - b; }) : state.leave.filter(function (x) { return x !== n; });
  renderLeaveGrid(); render();
  write('toggleLeave', [date, n, on]);
}

/* ---------- 聯絡簿 ---------- */
function openDiary() {
  openModal('<h2>編輯今日聯絡簿</h2><p style="margin:0;color:var(--muted);font-size:14px">一行寫一項，大螢幕會自動加上編號。</p>' +
    '<textarea class="copybox" id="diary-text" placeholder="例如：&#10;數學習作 p.32–33&#10;國語第五課生字各寫一行&#10;明天帶美勞用具">' + esc(state.diary) + '</textarea>' +
    '<button class="btn btn-line" onclick="fillDiary()">帶入今天的作業名稱</button>' +
    '<div class="dialog-actions"><button class="btn btn-line" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-blue" onclick="saveDiary()">儲存</button></div>');
  document.getElementById('diary-text').focus();
}
function fillDiary() {
  var box = document.getElementById('diary-text');
  var have = diaryLines(box.value);
  var add = state.assignments.map(function (a) { return a.title; }).filter(function (t) {
    return !have.some(function (l) { return l.indexOf(t) === 0; });
  });
  if (!add.length) { toast('作業名稱都已經在聯絡簿裡了'); return; }
  box.value = have.concat(add).join('\n');
  box.focus();
}
function saveDiary() {
  var text = document.getElementById('diary-text').value;
  state.diary = diaryLines(text).join('\n');
  closeModal(); render();
  write('setDiary', [date, state.diary], '聯絡簿已儲存');
}
/* ---------- 大螢幕工具（教師端） ---------- */
var pickNoRepeat = true;
function toolPanel() {
  var t = state.tool;
  var h = '<section class="panel"><h2>大螢幕工具</h2>';
  h += '<div class="tool-block"><b>公告列</b><span style="font-size:14px;color:' + (state.announce ? 'var(--ink)' : 'var(--muted)') + '">' +
    (state.announce ? esc(state.announce) : '目前沒有公告') + '</span>' +
    '<div class="tool-row"><button class="small" onclick="openAnnounce()">' + (state.announce ? '修改公告' : '發布公告') + '</button>' +
    (state.announce ? '<button class="small danger" onclick="saveAnnounce(\'\')">清除</button>' : '') + '</div></div>';

  h += '<div class="tool-block"><b>倒數計時</b>';
  if (t && t.type === 'timer') {
    h += '<span class="timer-big timer-left">' + fmtTime(remainingMs(t)) + '</span><div class="tool-row">' +
      (t.end ? '<button class="small" onclick="timer(\'pause\')">暫停</button>' : '<button class="small" onclick="timer(\'resume\')">繼續</button>') +
      '<button class="small danger" onclick="timer(\'stop\')">結束並關閉</button></div>';
  } else {
    h += '<div class="tool-row">' + [1, 3, 5, 10].map(function (m) {
      return '<button class="small" onclick="timer(\'start\',' + (m * 60) + ')">' + m + ' 分</button>';
    }).join('') + '<button class="small" onclick="customTimer()">自訂</button></div>';

/* 每一列各自找出「放得下所有項目」的最大字級；大／中／小只是設定上限 */
function fitDiary() {
  var root = document.documentElement;
  root.classList.add('display-mode');
  var portrait = window.innerWidth < 760 && window.innerWidth < window.innerHeight;
  root.classList.toggle('dd-portrait', portrait);
  if (portrait) {   // 手機直向：固定字級、整頁捲動
    root.style.fontSize = Math.min(17, window.innerWidth / 24).toFixed(2) + 'px';
    var all = document.querySelectorAll('.dd-label,.dd-list');
    for (var q = 0; q < all.length; q++) all[q].style.fontSize = '';
    return;
  }
  root.style.fontSize = (window.innerHeight / 54 * Math.max(userZoom, 0.8)).toFixed(2) + 'px';
  var cap = { '自動': 0.07, '大': 0.055, '中': 0.045, '小': 0.035 };
  // 科目名稱：在色塊內盡量放大（最大約為畫面高度的 9%），名稱長的會自動換行或縮小
  var labels = document.querySelectorAll('.dd-label');
  for (var j = 0; j < labels.length; j++) {
    var lb = labels[j], sp = lb.querySelector('span');
    var lmax = Math.min(window.innerHeight * 0.09 * userZoom, lb.clientHeight * 0.8);
    var lfits = function (px) {
      lb.style.fontSize = px + 'px';
      return sp.offsetHeight <= lb.clientHeight - 6 && sp.scrollWidth <= lb.clientWidth - 12;
    };
    var a = 10, z = Math.max(lmax, 10);
    if (lfits(z)) a = z; else for (var k2 = 0; k2 < 14; k2++) { var m2 = (a + z) / 2; if (lfits(m2)) a = m2; else z = m2; }
    lb.style.fontSize = Math.floor(a * 0.96) + 'px';
  }
  var lists = document.querySelectorAll('.dd-list');
  for (var i = 0; i < lists.length; i++) {
    var box = lists[i], inner = box.querySelector('.dd-inner');
    var max = window.innerHeight * (cap[box.getAttribute('data-size')] || 0.07) * userZoom;
    var fits = function (px) {
      box.style.fontSize = px + 'px';
      return inner.offsetHeight <= box.clientHeight - 2 && inner.scrollWidth <= inner.clientWidth + 1;
    };
    var lo = 8, hi = max;
    if (fits(hi)) { lo = hi; } else {
      for (var k = 0; k < 14; k++) { var mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    }
    box.style.fontSize = Math.floor(lo * 0.97) + 'px';
  }
}

/* ---------- 大螢幕自動縮放：找出「剛好塞滿螢幕又不需捲動」的最大字級 ---------- */
var userZoom = 1;   // 老師手動微調的倍率（0.5～1），存在這台電腦的瀏覽器裡
try { var z = parseFloat(localStorage.getItem('displayZoom')); if (z >= 0.5 && z <= 1) userZoom = z; } catch (e) {}

function fitDisplay() {
  document.documentElement.classList.remove('dd-portrait');
  var root = document.documentElement;
  var wrap = document.querySelector('.d-wrap');
  if (!wrap) return;
  root.classList.add('display-mode');
  var fits = function (px) {
    root.style.fontSize = px + 'px';
    return wrap.scrollHeight <= window.innerHeight && wrap.scrollWidth <= window.innerWidth;
  };
  var lo = 6, hi = 60;
  for (var i = 0; i < 18; i++) {          // 二分搜尋
    var mid = (lo + hi) / 2;
    if (fits(mid)) lo = mid; else hi = mid;
  }
  // 留 3% 餘裕並無條件捨去，避免卡在「剛好換行」的臨界值而多出一行
  root.style.fontSize = (Math.floor(lo * 0.97 * userZoom * 100) / 100) + 'px';
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (VIEW === 'display') fitAll(); });
function zoom(step) {
  userZoom = Math.min(1, Math.max(0.5, Math.round((userZoom + step) * 10) / 10));
  try { localStorage.setItem('displayZoom', String(userZoom)); } catch (e) {}
  fitAll();
  toast(userZoom >= 1 ? '已恢復自動填滿螢幕' : '目前為自動大小的 ' + Math.round(userZoom * 100) + '%');
}
window.addEventListener('resize', function () { if (VIEW === 'display') fitAll(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === '-' || e.key === '_') zoom(-0.1);

      if (e.key === 'ArrowLeft') displayGo(-1);

}

/* ---------- 家長版聯絡簿圖片：在手機上畫成一張 PNG，可直接分享到 LINE 或存到相簿 ---------- */
var IMG_FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif';
function wrapText(ctx, text, maxW) {
  var tokens = String(text).match(/[A-Za-z0-9.\-\/+%~]+|\s+|[\s\S]/g) || [];
  var lines = [], cur = '';
  tokens.forEach(function (tk) {
    if (ctx.measureText(cur + tk).width <= maxW || !cur) {
      if (ctx.measureText(tk).width > maxW) {           // 超長英數字串逐字切
        for (var i = 0; i < tk.length; i++) {
          if (ctx.measureText(cur + tk[i]).width > maxW && cur) { lines.push(cur); cur = ''; }
          cur += tk[i];
        }
      } else cur += tk;
    } else { lines.push(cur.replace(/\s+$/, '')); cur = tk.replace(/^\s+/, ''); }
  });
  if (cur.trim()) lines.push(cur);
  return lines.length ? lines : [''];
}
function roundRect(ctx, x, y, w, hgt, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hgt, r); ctx.arcTo(x + w, y + hgt, x, y + hgt, r);
  ctx.arcTo(x, y + hgt, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawDiaryImage() {
  var W = 1080, P = 48, LBL = 230, GAP = 22;

    return { b: b, items: state.items.filter(function (it) { return it.block === b.name; }) };
  }).filter(function (x) { return x.items.length; });
  var cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  var textX = P + LBL + 34, numW = 52, textW = W - P - 34 - textX - numW;

      ctx.fillStyle = c; ctx.font = '900 28px ' + IMG_FONT; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), textX + 20, ry + 44); ctx.textAlign = 'left';

function hm(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
/** 依現在時間算出：正在上哪一節、下一節是什麼。不是今天、停課、週末或沒有課表時回傳 null */
function periodNow() {
  if (!state || !state.timetable || !state.timetable.length) return null;
  if (date !== todayStr() || state.day.type === '停課') return null;
  var wd = new Date().getDay();
  if (wd === 0 || wd === 6) return null;
  var list = state.timetable.filter(function (p) { return p.subj[wd - 1]; }).map(function (p) {
    return { name: p.name, start: p.start, end: p.end, subj: p.subj[wd - 1], s: hm(p.start), e: hm(p.end) };
  });
  if (!list.length) return null;
  var d = new Date(serverNow()), now = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  for (var i = 0; i < list.length; i++) {
    if (now >= list[i].s && now < list[i].e) return { mode: 'in', cur: list[i], next: list[i + 1] || null, left: Math.ceil(list[i].e - now) };
    if (now < list[i].s) return { mode: i ? 'break' : 'before', cur: null, next: list[i], left: Math.ceil(list[i].s - now) };
  }
  return { mode: 'done', cur: null, next: null, left: 0 };
}

  return c;
}
function subjHtml(name) { var c = subjColor(name); return '<span' + (c ? ' style="color:' + c + '"' : '') + '>' + esc(name) + '</span>'; }
function ttInner() {
  var p = periodNow();

  return '<div class="tt-now"><span class="tt-tag brk">' + (p.mode === 'before' ? '還沒上課' : '下課') + '</span>' +
    '<span class="tt-sub" style="font-size:.7em">下一節</span>' + (p.next.subj.indexOf(p.next.name) === 0 ? '' : esc(p.next.name) + ' ') + subjHtml(p.next.subj) +
    '<span class="tt-sub">' + p.next.start + ' 上課</span></div>';

    render();
    var db = firebase.database();
    startData(db, scheduleRefresh, function () { denied = true; render(); })
      .then(function () {
        connectedRef().on('value', function (snap) { syncOk = !!snap.val(); updateSync(); });
        scheduleRefresh();
      })
      .catch(function (e) {
        if (/permission/i.test((e && (e.code || e.message)) || '')) denied = true; else toast(errMsg(e));
        render();
      });
  });
}

render();
</script>
</body>
</html>
